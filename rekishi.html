<script>
"use strict";
(function(){
/* ================= データ ================= */
function j(year, category, title, detail, approx){ return {id:"j"+year+"-"+title, year:year, lane:"japan", category:category, title:title, detail:detail, approx:!!approx}; }
function w(year, category, title, detail, approx){ return {id:"w"+year+"-"+title, year:year, lane:"world", category:category, title:title, detail:detail, approx:!!approx}; }
const JAPAN_ERAS = [
  { name: "縄文時代", start: -3000, end: -400 },
  { name: "弥生時代", start: -400, end: 250 },
  { name: "古墳時代", start: 250, end: 592 },
  { name: "飛鳥時代", start: 592, end: 710 },
  { name: "奈良時代", start: 710, end: 794 },
  { name: "平安時代", start: 794, end: 1185 },
  { name: "鎌倉時代", start: 1185, end: 1333 },
  { name: "建武の新政", start: 1333, end: 1336 },
  { name: "室町時代", start: 1336, end: 1573 },
  { name: "安土桃山時代", start: 1573, end: 1603 },
  { name: "江戸時代", start: 1603, end: 1868 },
  { name: "明治", start: 1868, end: 1912 },
  { name: "大正", start: 1912, end: 1926 },
  { name: "昭和", start: 1926, end: 1989 },
  { name: "平成", start: 1989, end: 2019 },
  { name: "令和", start: 2019, end: 2025 },
];
const WORLD_ERAS = [
  { name: "古代", start: -3000, end: 476 },
  { name: "中世", start: 476, end: 1453 },
  { name: "近世", start: 1453, end: 1789 },
  { name: "近代", start: 1789, end: 1945 },
  { name: "現代", start: 1945, end: 2025 },
];
const EVENTS = [
  // ---- 日本 ----
  j(-400, "society", "稲作が広まる", "大陸から伝わった稲作が西日本から広がり、ムラができ、貧富や身分の差が生まれた。弥生土器や青銅器・鉄器も使われた。", true),
  j(57, "war", "奴国王が金印を受ける", "倭の奴国の王が後漢に使いを送り、皇帝から金印を授かった。志賀島（福岡県）で見つかった金印がこれとされる。"),
  j(239, "war", "卑弥呼が魏に使い", "邪馬台国の女王卑弥呼が魏に使いを送り、「親魏倭王」の称号と金印を授かったと『魏志』倭人伝に記される。"),
  j(538, "culture", "仏教が伝わる", "百済から仏像や経典が伝えられた（552年とする説もある）。仏教の受け入れをめぐり蘇我氏と物部氏が対立した。"),
  j(593, "politics", "聖徳太子が政治に参加", "聖徳太子（厩戸皇子）が推古天皇を助けて、蘇我馬子とともに天皇中心の政治をめざした。"),
  j(604, "politics", "十七条の憲法", "聖徳太子が役人の心構えを示した。前年には冠位十二階を定め、才能ある人を役人に取り立てた。"),
  j(607, "war", "遣隋使を送る", "小野妹子らを隋に派遣し、対等な国交を求めるとともに、進んだ制度や文化を取り入れようとした。"),
  j(645, "politics", "大化の改新", "中大兄皇子と中臣鎌足が蘇我氏を倒し、土地と人民を国家のものとする公地公民などの改革を進めた。"),
  j(701, "politics", "大宝律令", "唐の律令にならった法律が完成し、天皇を中心とする律令国家のしくみが整った。"),
  j(710, "politics", "平城京に都を移す", "唐の長安にならった都・平城京（奈良）に都が移され、奈良時代が始まった。"),
  j(743, "society", "墾田永年私財法", "新しく開墾した土地の永久の私有を認めた。貴族や寺社の私有地（のちの荘園）が広がるきっかけとなった。"),
  j(752, "culture", "東大寺の大仏完成", "聖武天皇が仏教の力で国を守ろうと造らせた大仏の開眼供養が行われた。天平文化が栄えた。"),
  j(794, "politics", "平安京に都を移す", "桓武天皇が都を平安京（京都）に移し、政治の立て直しを図った。平安時代が始まった。"),
  j(894, "war", "遣唐使の停止", "菅原道真の提案で遣唐使が停止された。その後、かな文字など日本風の国風文化が栄えた。"),
  j(1016, "politics", "藤原道長が摂政に", "藤原氏は娘を天皇のきさきにして摂政・関白の地位につく摂関政治を行い、道長・頼通のころ全盛期を迎えた。"),
  j(1086, "politics", "院政が始まる", "白河天皇が位をゆずって上皇となった後も政治を行った。院政は武士が力をのばすきっかけにもなった。"),
  j(1167, "politics", "平清盛が太政大臣に", "平清盛が武士として初めて太政大臣となり、日宋貿易にも力を入れた。"),
  j(1185, "war", "壇ノ浦の戦い", "源義経らが平氏をほろぼした。源頼朝は国ごとに守護、荘園などに地頭を置き、鎌倉幕府の基礎を固めた。"),
  j(1192, "politics", "源頼朝が征夷大将軍に", "源頼朝が朝廷から征夷大将軍に任命された。将軍と御家人は御恩と奉公の関係で結ばれた。"),
  j(1221, "war", "承久の乱", "後鳥羽上皇が幕府を倒そうと兵を挙げたが敗れた。幕府は京都に六波羅探題を置き、支配を西日本にも広げた。"),
  j(1232, "politics", "御成敗式目", "執権北条泰時が、武士の慣習をもとに裁判の基準となる武士の法律を定めた。"),
  j(1274, "war", "元寇（文永の役）", "元の大軍が九州北部に攻めてきた。1281年の弘安の役とあわせて元寇とよぶ。御家人の生活が苦しくなった。"),
  j(1333, "politics", "鎌倉幕府がほろびる", "後醍醐天皇の呼びかけに足利尊氏らが応じ、鎌倉幕府がほろびた。翌年、建武の新政が始まった。"),
  j(1338, "politics", "足利尊氏が征夷大将軍に", "足利尊氏が京都に幕府を開いた。朝廷は南朝と北朝に分かれて争った（南北朝時代）。"),
  j(1392, "politics", "南北朝の統一", "3代将軍足利義満が南北朝を統一した。義満は京都の室町に「花の御所」を建てた。"),
  j(1404, "war", "日明貿易が始まる", "足利義満が明と貿易を始めた。正式な貿易船に勘合を持たせたので勘合貿易ともいう。"),
  j(1467, "war", "応仁の乱", "将軍のあとつぎ問題などから京都で11年続いた戦乱。この後、下剋上の風潮が広がり戦国時代となった。"),
  j(1543, "society", "鉄砲が伝わる", "種子島に流れ着いたポルトガル人によって鉄砲が伝えられ、戦い方や城のつくりが変わった。"),
  j(1549, "culture", "キリスト教が伝わる", "イエズス会のフランシスコ・ザビエルが鹿児島に来て、キリスト教を伝えた。"),

var KNOTS = [[-3000,0],[-1000,240],[0,420],[500,620],[1000,860],[1500,1140],[1800,1480],[1900,1760],[2025,2060]];

  var y = Math.min(MAX_YEAR, Math.max(MIN_YEAR, year));
  for (var i=0;i<KNOTS.length-1;i++){ var a=KNOTS[i], b=KNOTS[i+1];
    if (y <= b[0]) return a[1] + (y-a[0])/(b[0]-a[0])*(b[1]-a[1]); }
  return TOTAL_UNITS;
}
function unitToYear(unit){
  var u = Math.min(TOTAL_UNITS, Math.max(0, unit));
  for (var i=0;i<KNOTS.length-1;i++){ var a=KNOTS[i], b=KNOTS[i+1];
    if (u <= b[1]) return a[0] + (u-a[1])/(b[1]-a[1])*(b[0]-a[0]); }
  return MAX_YEAR;
}
function buildTicks(pxPerUnit){
  var steps=[10,20,50,100,200,500,1000], set={};
  for (var i=0;i<KNOTS.length-1;i++){ var a=KNOTS[i], b=KNOTS[i+1];
    var pxPerYear = (b[1]-a[1])/(b[0]-a[0])*pxPerUnit, step=1000;
    for (var s=0;s<steps.length;s++) if (steps[s]*pxPerYear>=70){ step=steps[s]; break; }
    for (var y=Math.ceil(a[0]/step)*step; y<=b[0]; y+=step) set[y]=true;

function layoutLane(events){
  var rowsEnd=[];
  return events.slice().sort(function(a,b){return a.year-b.year;}).map(function(ev){
    var x=xOf(ev.year), wdt=ev.title.length*12.5+shortYear(ev.year).length*7.5+34, row=-1;
    for (var i=0;i<rowsEnd.length;i++) if (rowsEnd[i]+6<x){ row=i; break; }
    if (row===-1){
      if (rowsEnd.length<MAX_ROWS){ row=rowsEnd.length; rowsEnd.push(0); }
      else { var m=Math.min.apply(null,rowsEnd); row=rowsEnd.indexOf(m); }
    }
    rowsEnd[row]=x+wdt;
    return {ev:ev, x:x, row:row};
  });
}

/* ================= 年表キャンバスの描画 ================= */
var markerEls = {}; // id -> {btn, stem, x}
var eraEls = {japan:[], world:[]};

function renderCanvas(){
  var contentW = TOTAL_UNITS*state.zoom + pad()*2;
  canvas.style.width = contentW+"px"; canvas.style.height = TOTAL_H+"px";
  canvas.textContent = "";
  markerEls = {}; eraEls = {japan:[], world:[]};
  var ticks = buildTicks(state.zoom);
  ticks.forEach(function(t){
    var g=el("div","grid"+(t===0?" zero":"")); g.setAttribute("aria-hidden","true");
    g.style.left=xOf(t)+"px"; g.style.height=TOTAL_H+"px"; canvas.appendChild(g);
  });
  drawEras(JAPAN_ERAS, JP_BAND_TOP, "japan");
  drawEras(WORLD_ERAS, WD_BAND_TOP, "world");
  var axis=el("div","axis"); axis.setAttribute("aria-hidden","true");
  axis.style.top=AXIS_TOP+"px"; axis.style.height=AXIS_H+"px"; axis.style.width=contentW+"px";
  ticks.forEach(function(t){ var s=el("span","tick",shortYear(t)); s.style.left=xOf(t)+"px"; axis.appendChild(s); });
  canvas.appendChild(axis);
  var vis = visibleEvents();
  layoutLane(vis.filter(function(e){return e.lane==="japan";})).forEach(function(p){ drawMarker(p,"japan"); });
  layoutLane(vis.filter(function(e){return e.lane==="world";})).forEach(function(p){ drawMarker(p,"world"); });
}
function drawEras(eras, top, lane){
  eras.forEach(function(e,i){
    var left=xOf(e.start), width=xOf(e.end)-left;
    var d=el("div","era "+(i%2?"b":"a"), width>28?e.name:"");
    d.setAttribute("aria-hidden","true");
    d.title = e.name+"（"+formatYear(e.start)+"〜"+(e.end>=MAX_YEAR?"":formatYear(e.end))+"）";
    d.style.left=left+"px"; d.style.width=width+"px"; d.style.top=(top+3)+"px"; d.style.height=(BAND_H-6)+"px";
    d.dataset.name=e.name;
    canvas.appendChild(d); eraEls[lane].push(d);
  });
}
function drawMarker(p, lane){
  var cat=catOf(p.ev.category);
  var labelTop = lane==="japan" ? LANE_H-(p.row+1)*ROW_H : WD_LANE_TOP+6+p.row*ROW_H;
  var stemTop = lane==="japan" ? labelTop+ROW_H-4 : WD_BAND_TOP+BAND_H-3;
  var stemH = lane==="japan" ? JP_BAND_TOP+3-stemTop : labelTop+4-stemTop;
  var stem=el("div","stem"); stem.setAttribute("aria-hidden","true");
  stem.style.left=p.x+"px"; stem.style.top=stemTop+"px"; stem.style.height=Math.max(0,stemH)+"px";
  var b=el("button","ev"); b.type="button";
  b.setAttribute("aria-label", formatYear(p.ev.year)+(p.ev.approx?"ごろ":"")+" "+(lane==="japan"?"日本":"世界")+" "+cat.label+"："+p.ev.title);
  b.style.left=(p.x-7)+"px"; b.style.top=labelTop+"px"; b.style.height=(ROW_H-6)+"px";
  var dot=el("span","dot "+p.ev.category); dot.setAttribute("aria-hidden","true");
  b.appendChild(dot); b.appendChild(el("span","y",shortYear(p.ev.year))); b.appendChild(el("span",null,p.ev.title));
  b.addEventListener("click", function(){ pick(p.ev); });
  canvas.appendChild(stem); canvas.appendChild(b);
  markerEls[p.ev.id] = {btn:b, stem:stem, x:p.x};
}

/* ================= 現在位置に応じた更新 ================= */
function nearestEvent(){
  var best=null, bestD=Infinity, cu=yearToUnit(state.centerYear);
  visibleEvents().forEach(function(e){ var d=Math.abs(yearToUnit(e.year)-cu); if (d<bestD){ bestD=d; best=e; } });
  return best;
}
function selectedEvent(){
  if (state.pickedId){ for (var i=0;i<EVENTS.length;i++) if (EVENTS[i].id===state.pickedId) return EVENTS[i]; }
  return nearestEvent();
}
var lastDetailId=null, lastRangeKey=null;
function updateDynamic(){
  var cy=state.centerYear, jp=eraAt(JAPAN_ERAS,cy), wd=eraAt(WORLD_ERAS,cy);
  $("ryear").textContent=formatYear(cy); $("rcent").textContent=centuryLabel(cy);
  $("rjp").textContent=jp?jp.name:"—"; $("rwd").textContent=wd?wd.name:"—";
  $("playtag").textContent=shortYear(cy);
  scroller.setAttribute("aria-label","年表の表示位置 "+formatYear(cy)+"。左右の矢印キーで時代を移動");
  eraEls.japan.forEach(function(d){ d.classList.toggle("cur", !!jp && d.dataset.name===jp.name); });
  eraEls.world.forEach(function(d){ d.classList.toggle("cur", !!wd && d.dataset.name===wd.name); });
  var sel=selectedEvent(), cx=xOf(cy);
  Object.keys(markerEls).forEach(function(id){
    var m=markerEls[id], isSel = sel && sel.id===id;
    m.btn.classList.toggle("sel", !!isSel);
    m.btn.classList.toggle("near", !isSel && Math.abs(m.x-cx)<30);
    m.btn.setAttribute("aria-pressed", isSel?"true":"false");
    m.stem.classList.toggle("sel", !!isSel);
  });
  $("detail").setAttribute("aria-live", state.playing?"off":"polite");
  var selId = sel?sel.id:null;
  if (selId!==lastDetailId){ lastDetailId=selId; renderDetail(sel); }
  var rk = Math.round(state.range[0])+":"+Math.round(state.range[1])+":"+selId+":"+state.activeCats.join(",");
  if (rk!==lastRangeKey){ lastRangeKey=rk; renderLists(selId); }
}

function eventRow(ev, selected){
  var b=el("button","row"); b.type="button";
  if (selected) b.setAttribute("aria-current","true");
  var d=el("span","dot "+ev.category); d.setAttribute("aria-hidden","true");
  b.appendChild(d); b.appendChild(el("span","y",shortYear(ev.year))); b.appendChild(el("span","t",ev.title));
  b.appendChild(el("span","sr-only",catOf(ev.category).label));
  b.addEventListener("click", function(){ pick(ev); });
  return b;
}
function renderDetail(sel){
  var box=$("detail"); box.textContent="";
  if (!sel){ box.appendChild(el("p","empty","表示できるできごとがありません")); return; }
  var cat=catOf(sel.category), meta=el("div","meta");
  meta.appendChild(el("b",null,formatYear(sel.year)+(sel.approx?"ごろ":"")));
  meta.appendChild(el("span","pill",sel.lane==="japan"?"日本":"世界"));
  var cp=el("span","pill"); var cd=el("span","dot "+sel.category); cd.setAttribute("aria-hidden","true");
  cp.appendChild(cd); cp.appendChild(document.createTextNode(cat.label)); meta.appendChild(cp);
  box.appendChild(meta);
  box.appendChild(el("h3","dtitle",sel.title));
  box.appendChild(el("p","dtext",sel.detail));
  var je=eraAt(JAPAN_ERAS,sel.year), we=eraAt(WORLD_ERAS,sel.year);
  box.appendChild(el("p","derash","日本："+(je?je.name:"—")+" ／ 世界："+(we?we.name:"—")));
  box.appendChild(el("h4","subh","同じころの"+(sel.lane==="japan"?"世界":"日本")+"（前後30年）"));
  var other = sel.lane==="japan"?"world":"japan";
  var same = EVENTS.filter(function(e){ return e.lane===other && Math.abs(e.year-sel.year)<=30; })
    .sort(function(a,b){ return Math.abs(a.year-sel.year)-Math.abs(b.year-sel.year); }).slice(0,4);
  if (same.length){ var ul=el("ul","rows"); same.forEach(function(e){ var li=el("li"); li.appendChild(eventRow(e,false)); ul.appendChild(li); }); box.appendChild(ul); }
  else box.appendChild(el("p","empty","この年表にはありません"));
}
function renderLists(selId){
  ["japan","world"].forEach(function(lane){
    var key = lane==="japan"?"jp":"wd";
    var evs = visibleEvents().filter(function(e){ return e.lane===lane && e.year>=state.range[0] && e.year<=state.range[1]; })
      .sort(function(a,b){return a.year-b.year;});
    $("cnt-"+key).textContent = evs.length+"件";
    var box=$("list-"+key), prevScroll = box.firstChild ? box.firstChild.scrollTop : 0; box.textContent="";
    if (!evs.length){ box.appendChild(el("p","empty","表示範囲にできごとはありません")); return; }
    var ul=el("ul","rows list-scroll");
    evs.forEach(function(e){ var li=el("li"); li.appendChild(eventRow(e, e.id===selId)); ul.appendChild(li); });
    box.appendChild(ul); ul.scrollTop = prevScroll;
  });
}

/* ================= スクロールと年の同期 ================= */
function readScroll(){
  var z=state.zoom, p=pad();
  state.centerYear = unitToYear(scroller.scrollLeft/z);
  state.range = [unitToYear((scroller.scrollLeft-p)/z), unitToYear((scroller.scrollLeft+scroller.clientWidth-p)/z)];
  updateDynamic();
}
function scrollToYear(year, smooth){
  scroller.scrollTo({left: yearToUnit(year)*state.zoom, behavior: (smooth!==false && !reducedMotion) ? "smooth" : "auto"});
}
function relayout(){
  var keep = state.centerYear;
  state.viewW = scroller.clientWidth;
  renderCanvas();
  scroller.scrollLeft = yearToUnit(keep)*state.zoom;
  lastDetailId=null; lastRangeKey=null;
  readScroll();

}
var rafScroll=0;
scroller.addEventListener("scroll", function(){ cancelAnimationFrame(rafScroll); rafScroll=requestAnimationFrame(readScroll); }, {passive:true});
if (window.ResizeObserver){ new ResizeObserver(function(){ if (scroller.clientWidth!==state.viewW) relayout(); }).observe(scroller); }
else window.addEventListener("resize", relayout);

/* キーボード操作 */
scroller.addEventListener("keydown", function(e){
  var step = e.shiftKey ? 400 : 120;
  if (e.key==="ArrowRight"){ e.preventDefault(); stopPlay(); scroller.scrollBy({left:step, behavior:reducedMotion?"auto":"smooth"}); }
  else if (e.key==="ArrowLeft"){ e.preventDefault(); stopPlay(); scroller.scrollBy({left:-step, behavior:reducedMotion?"auto":"smooth"}); }
  else if (e.key==="Home"){ e.preventDefault(); stopPlay(); state.pickedId=null; scrollToYear(MIN_YEAR); }
  else if (e.key==="End"){ e.preventDefault(); stopPlay(); state.pickedId=null; scrollToYear(MAX_YEAR); }
});

/* マウスドラッグで移動 */
var drag=null;
scroller.addEventListener("pointerdown", function(e){
  if (state.playing) stopPlay();
  if (e.pointerType!=="mouse" || e.target.closest("button")) return;
  drag={x:e.clientX, left:scroller.scrollLeft}; scroller.setPointerCapture(e.pointerId); scroller.classList.add("dragging");
});
scroller.addEventListener("pointermove", function(e){ if (drag) scroller.scrollLeft = drag.left-(e.clientX-drag.x); });
function endDrag(){ drag=null; scroller.classList.remove("dragging"); }
scroller.addEventListener("pointerup", endDrag); scroller.addEventListener("pointercancel", endDrag);
scroller.addEventListener("wheel", function(){ if (state.playing) stopPlay(); }, {passive:true});

/* ================= 自動再生 ================= */
var playRaf=0;
var ICON_PLAY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>';
var ICON_PAUSE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg>';
function renderPlayBtn(){ var b=$("play"); b.innerHTML = (state.playing?ICON_PAUSE:ICON_PLAY)+"<span>"+(state.playing?"一時停止":"再生")+"</span>"; b.setAttribute("aria-pressed", state.playing?"true":"false"); }
function startPlay(){
  if (state.centerYear >= MAX_YEAR-1) scroller.scrollLeft = 0;
  state.pickedId=null; state.playing=true; renderPlayBtn(); lastDetailId=null;
  var last=performance.now(), pos=scroller.scrollLeft;
  var px = SPEEDS.filter(function(s){return s.key===state.speed;})[0].px;
  function step(now){
    if (!state.playing) return;
    var dt=Math.min(0.1,(now-last)/1000); last=now;
    px = SPEEDS.filter(function(s){return s.key===state.speed;})[0].px;
    pos += px*dt;
    var max = scroller.scrollWidth-scroller.clientWidth;
    if (pos>=max){ scroller.scrollLeft=max; stopPlay(); return; }
    scroller.scrollLeft = pos;
    playRaf=requestAnimationFrame(step);
  }
  playRaf=requestAnimationFrame(step);
}
function stopPlay(){ if (!state.playing) return; state.playing=false; cancelAnimationFrame(playRaf); renderPlayBtn(); updateDynamic(); }
$("play").addEventListener("click", function(){ state.playing ? stopPlay() : startPlay(); });
$("toStart").addEventListener("click", function(){ stopPlay(); state.pickedId=null; scrollToYear(MIN_YEAR); });
$("toEnd").addEventListener("click", function(){ stopPlay(); state.pickedId=null; scrollToYear(MAX_YEAR); });

/* 速さ */
function renderSpeeds(){
  var box=$("speeds"); box.textContent="";
  SPEEDS.forEach(function(s){
    var b=el("button",null,s.label); b.type="button"; b.setAttribute("aria-pressed", state.speed===s.key?"true":"false");
    b.addEventListener("click", function(){ state.speed=s.key; renderSpeeds(); });
    box.appendChild(b);
  });
}

/* 分野 */
function renderCats(){
  var box=$("cats"); box.textContent="";
  CATEGORIES.forEach(function(c){
    var on = state.activeCats.indexOf(c.key)>=0;
    var b=el("button","chip"); b.type="button"; b.setAttribute("aria-pressed", on?"true":"false");
    var d=el("span","dot "+c.key); d.setAttribute("aria-hidden","true");
    b.appendChild(d); b.appendChild(document.createTextNode(c.label));
    b.addEventListener("click", function(){
      if (on){ if (state.activeCats.length>1) state.activeCats = state.activeCats.filter(function(k){return k!==c.key;}); }
      else state.activeCats = state.activeCats.concat([c.key]);
      if (state.pickedId){ var p=EVENTS.filter(function(e){return e.id===state.pickedId;})[0]; if (p && state.activeCats.indexOf(p.category)<0) state.pickedId=null; }
      renderCats(); relayout();
    });
    box.appendChild(b);
  });
}

/* 時代へジャンプ */
(function(){
  var s=$("jump");
  var ph=el("option",null,"時代へジャンプ"); ph.value=""; s.appendChild(ph);
  [["日本の時代","japan",JAPAN_ERAS],["世界の時代区分","world",WORLD_ERAS]].forEach(function(g){
    var og=document.createElement("optgroup"); og.label=g[0];
    g[2].forEach(function(e){ var o=el("option",null,e.name); o.value=g[1]+":"+e.name; og.appendChild(o); });
    s.appendChild(og);
  });
  s.addEventListener("change", function(){
    var v=s.value; if (!v) return;
    var parts=v.split(":"), eras = parts[0]==="japan"?JAPAN_ERAS:WORLD_ERAS;
    var era = eras.filter(function(e){return e.name===parts[1];})[0];
    s.value="";
    if (!era) return;
    stopPlay(); state.pickedId=null;
    scrollToYear(Math.min(era.end, era.start+Math.max(1,(era.end-era.start)*0.15)));
  });
})();

/* 拡大・縮小 */
$("zoom").addEventListener("input", function(e){ state.zoom = parseFloat(e.target.value); relayout(); });

function pick(ev){
  stopPlay(); state.pickedId=ev.id; lastDetailId=null; lastRangeKey=null;
  scrollToYear(ev.year); updateDynamic();
}

/* ================= 初期化 ================= */
renderPlayBtn(); renderSpeeds(); renderCats();
relayout();
})();
</script>
</body>
</html>
